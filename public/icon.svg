<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#0b0d11"/>
      <stop offset="100%" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2433"/>
      <stop offset="100%" stop-color="#131722"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#accent-grad)" opacity="0.18" filter="url(#glow)"/>

  <!-- Mailbox / Envelope Container -->
  <g transform="translate(96, 126)">
    <!-- Base Card -->
    <rect x="0" y="0" width="320" height="230" rx="36" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3"/>

    <!-- Inward Envelope Fold Details -->
    <path d="M 12 18 L 160 142 L 308 18" fill="none" stroke="url(#accent-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bottom Wings -->
    <path d="M 14 216 L 115 125" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 306 216 L 205 125" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="6" stroke-linecap="round"/>

    <!-- Notification Star / Badge -->
    <circle cx="270" cy="30" r="24" fill="#38bdf8"/>
    <polygon points="270,14 274.5,23.5 285,25 277,32.5 279,43 270,38 261,43 263,32.5 255,25 265.5,23.5" fill="#0b0d11"/>
  </g>
</svg>
